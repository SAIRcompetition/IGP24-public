id: igp24
name: "IGP24: The Inverse Galois Problem in Degree 24"
status: draft
task_type: mathematical_discovery
submission_artifact: submission.txt
submission_format: "plain text, one monic degree 24 polynomial per line, 25 comma-separated integer coefficients in ascending powers"
